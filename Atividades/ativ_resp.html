<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores</title>

    <style>
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .quadrado{
            border: 2px solid black;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blue; 
        }
        @media (min-width: 600px){
            .container{font-size: large;}
            .quadrado{background-color: green;}
        }
        @media (min-width: 992px){
            .container{font-size: large;}
            .quadrado{background-color: yellow;}
        }
        @media (min-width: 1200px){
            .container{font-size: large;}
            .quadrado{background-color: purple;}
        }
       
    </style>
</head>
<body>
    <div class="container">
        <h1>Trabalhando com Resposividade - Cores</h1>
        <h2 class="quadrado"></h2>

    </div>
</body>
</html>
