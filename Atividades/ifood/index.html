<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ifood - Delivery de Comidas</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Utlizando uma tag semântica para criar o cabeçalho -->
     <header class="cabecalho">
        <div class="container">
            <img src="https://logodownload.org/wp-content/uploads/2017/05/ifood-logo-0.png" alt="" class="logo">
            <!-- Utlizando um nav para adicionar os menus navegação -->
            <nav class="navegacao">
                <a href="#" class="item">Restaurante</a>
                <a href="#" class="item">Mercado</a>
                <a href="#" class="item">Bebidas</a>
                <a href="#" class="item">Farmácia</a>
                <a href="#" class="item">Pet-shop</a>
            </nav>
            <div>
                <input type="text" placeholder="Busque por item ou loja" class="buscar">
                <div class="localizacao">
                    <span>📍</span>
                    <input type="text" value="Andradina, SP" class="texto-local">
                </div>
            </div>
            <div class="acao">
                <a href="#" class="criar-conta">Criar Conta</a>
                <button class="botao-entrar">Entrar</button>
            </div>
        </div>
     </header>

    <main >

      <section class="produtos">
        <!-- seção de produtos -->
         <div class="card-produtos">
            <img src="https://png.pngtree.com/png-vector/20240724/ourmid/pngtree-plate-african-food-png-image_12907189.png" alt="">
            <p>Almoço</p>
         </div>
         <div class="card-produtos">
            <img src="https://png.pngtree.com/png-clipart/20220306/original/pngtree-red-shapes-promotion-banner-png-image_7420664.png" alt="">
            <p>Promoções</p>
         </div>
         <div class="card-produtos">
            <img src="https://png.pngtree.com/png-vector/20240907/ourmid/pngtree-full-brown-paper-bag-with-fresh-produce-juice-and-corn-on-png-image_13778894.png" alt="">
            <p>Mercado</p>
         </div>
         <div class="card-produtos">
            <img src="https://png.pngtree.com/png-vector/20250224/ourmid/pngtree-a-vibrant--cold-drink-glasses-png-image_15577698.png" alt="">
            <p>Bebidas</p>
         </div>
         <div class="card-produtos">
            <img src="https://png.pngtree.com/png-vector/20230728/ourmid/pngtree-packed-lunch-vector-png-image_6997284.png" alt="">
            <p>Marmita</p>
         </div>

      </section>

      <section>
        <!-- seção de lojas -->
      </section>

      <section>
        <!-- seção de promoções  -->
      </section>
    </main>

</body>
</html>
