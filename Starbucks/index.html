<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks - Cafeteria</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
   <header class="cabecalho">
    <div class="container">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/sco/thumb/d/d3/Starbucks_Corporation_Logo_2011.svg/2034px-Starbucks_Corporation_Logo_2011.svg.png" alt="">
        <nav class="navegacao">
            <a href="#" class="item">Menu</a>
            <a href="#" class="item">Rewards</a>
            <a href="#" class="item">Nosso Café</a>
            <a href="#" class="item">Impacto Social</a>
        </nav>

        <div>
            <input type="text" placeholder="📍Encontre uma Loja" class="buscar-loja">
        </div>

        <div class="botoes">
            <button class="botao-entrar">Entrar</button>
            <button class="botao-participe">Participe Agora</button>
        </div>
    </div>
   </header>
   
   <main>
        <div class="img">
             <img  src="https://res.cloudinary.com/hz3gmuqw6/image/upload/c_fill,q_auto,w_750,f_auto/f_auto/Starbucks-Menu-3-phpt7MPCF" alt="">
        </div>
    </main>
</body>
</html>
