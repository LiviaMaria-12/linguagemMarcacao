<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Somador Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Somador Online</h1>
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="botaoNumero()" class="w-full bg-green-500 text-white font-semibold py-2 px-4 rounded-lg
                 hover:bg-green-600 transition duration-200 ease-in-out">Clique aqui para somar!</button>
            </div>
            <div></div>
        </div>
        
    </div>

    <script>
    function botaoNumero(){
        var n1 = Number(prompt("Digite aqui um número:"));
        var n2 = Number(prompt("Digite outro número:"));
        alert(`A soma desses números é ${n1 + n2}`)
    }
    </script>
</body>
</html>
